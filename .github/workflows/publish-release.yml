name: publish-release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write

# One release pull request is one release transaction: retries of the same pull request serialize,
# while a pull request for the next version publishes independently.
concurrency:
  group: publish-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  BUILD_MANIFEST: src/Jellyfin.Plugin.TrickplayCropper/build.yaml
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  publish:
    name: Publish the stable release
    runs-on: ubuntu-24.04
    if: >-
      github.event.pull_request.merged == true
      && github.event.pull_request.title == 'auto-release new version'
      && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Verify the release pull request merged without a merge commit
        env:
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          parents="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${MERGE_COMMIT_SHA}" --jq '.parents | length')"
          if [[ "${parents}" != "1" ]]; then
            echo "::error::${MERGE_COMMIT_SHA} has ${parents} parents. A release pull request must be merged with squash or rebase so the merged build manifest stays the sole version source." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - name: Install pinned Code Map tokenizer
        run: python3 -m pip install --disable-pip-version-check tiktoken==0.12.0

      - name: Verify repository structure contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import pathlib
          import re
          import subprocess
          import sys
          import urllib.parse

          import tiktoken

          maximum_physical_lines = 500
          maximum_code_map_tokens = 1_000
          source_suffixes = {
              ".bash", ".c", ".cc", ".cpp", ".cs", ".csproj", ".fs", ".fsx",
              ".go", ".h", ".hh", ".hpp", ".java", ".js", ".jsx", ".kt",
              ".kts", ".mjs", ".php", ".ps1", ".psm1", ".py", ".pyw",
              ".rb", ".rs", ".scala", ".sh", ".sql", ".swift", ".targets",
              ".ts", ".tsx", ".vb", ".zsh", ".props",
          }
          workflow_suffixes = {".yaml", ".yml"}

          # Exclusions must remain exact Git-tracked paths categorized as generated or
          # third-party. The repository currently needs no exclusions.
          excluded_paths: dict[str, str] = {}
          allowed_exclusion_categories = {"generated", "third-party"}

          root = pathlib.Path.cwd().resolve()
          tracked_output = subprocess.check_output(["git", "ls-files", "-z"])
          tracked_paths = [
              pathlib.Path(raw.decode("utf-8"))
              for raw in tracked_output.split(b"\0")
              if raw
          ]
          tracked_names = {path.as_posix() for path in tracked_paths}
          failures: list[str] = []

          for path, category in excluded_paths.items():
              if category not in allowed_exclusion_categories:
                  failures.append(
                      f"Invalid exclusion category for {path}: {category}; "
                      "expected generated or third-party."
                  )
              if path not in tracked_names:
                  failures.append(f"Excluded path is not Git-tracked: {path}")

          def is_size_limited(path: pathlib.Path, data: bytes) -> bool:
              if path.suffix.lower() in source_suffixes:
                  return True
              if path.parts[:2] == (".github", "workflows"):
                  return path.suffix.lower() in workflow_suffixes
              return data.startswith(b"#!")

          for relative_path in tracked_paths:
              name = relative_path.as_posix()
              if name in excluded_paths:
                  continue
              data = relative_path.read_bytes()
              if not is_size_limited(relative_path, data):
                  continue
              physical_lines = data.count(b"\n")
              if data and not data.endswith(b"\n"):
                  physical_lines += 1
              if physical_lines > maximum_physical_lines:
                  failures.append(
                      f"{name}: {physical_lines} physical lines; "
                      f"maximum is {maximum_physical_lines}."
                  )

          if tiktoken.__version__ != "0.12.0":
              failures.append(
                  f"Tokenizer version is {tiktoken.__version__}; expected 0.12.0."
              )
          encoding = tiktoken.get_encoding("cl100k_base")
          code_maps = sorted(pathlib.Path("docs/code-maps").rglob("*.md"))
          markdown_link = re.compile(r"!?\[[^\]]*\]\(([^)]+)\)")
          for code_map in code_maps:
              source = code_map.read_text(encoding="utf-8")
              token_count = len(encoding.encode(source))
              if token_count > maximum_code_map_tokens:
                  failures.append(
                      f"{code_map.as_posix()}: {token_count} cl100k_base tokens; "
                      f"maximum is {maximum_code_map_tokens}."
                  )

              for raw_target in markdown_link.findall(source):
                  target = raw_target.strip()
                  if target.startswith("<") and target.endswith(">"):
                      target = target[1:-1]
                  parsed = urllib.parse.urlparse(target)
                  if parsed.scheme or target.startswith("#"):
                      continue
                  link_path = urllib.parse.unquote(parsed.path)
                  if not link_path:
                      continue
                  candidate = (
                      root / link_path.lstrip("/")
                      if link_path.startswith("/")
                      else code_map.parent / link_path
                  ).resolve()
                  try:
                      candidate.relative_to(root)
                  except ValueError:
                      failures.append(
                          f"{code_map.as_posix()}: local link escapes the repository: {target}"
                      )
                      continue
                  if not candidate.exists():
                      failures.append(
                          f"{code_map.as_posix()}: local link target does not exist: {target}"
                      )

          if failures:
              print("Repository structure contract violations:", file=sys.stderr)
              for failure in failures:
                  print(f"- {failure}", file=sys.stderr)
              raise SystemExit(1)

          print(
              f"Verified {len(tracked_paths)} tracked paths and "
              f"{len(code_maps)} Code Maps."
          )
          PY


      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "9.0.317"

      - name: Restore locked dependencies
        run: dotnet restore TrickplayCropper.sln --locked-mode

      - name: Verify formatting
        run: dotnet format TrickplayCropper.sln --verify-no-changes --no-restore

      - name: Build Release
        run: dotnet build TrickplayCropper.sln --configuration Release --no-restore

      - name: Run unit tests
        run: >-
          dotnet test tests/Jellyfin.Plugin.TrickplayCropper.UnitTests/Jellyfin.Plugin.TrickplayCropper.UnitTests.csproj
          --configuration Release
          --no-build
          --no-restore
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/coverage/unit

      - name: Run component tests
        run: >-
          dotnet test tests/Jellyfin.Plugin.TrickplayCropper.ComponentTests/Jellyfin.Plugin.TrickplayCropper.ComponentTests.csproj
          --configuration Release
          --no-build
          --no-restore
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/coverage/component

      - name: Upload coverage for inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: coverage
          if-no-files-found: error
          path: artifacts/coverage/**/coverage.cobertura.xml

      - name: Package production project with JPRM
        id: package
        uses: oddstr13/jellyfin-plugin-repository-manager@9497a0a499416cc572ed2e07a391d9f943a37b4d # v1.1.1
        with:
          path: src/Jellyfin.Plugin.TrickplayCropper
          output: artifacts/package
          dotnet-config: Release
          dotnet-target: net9.0
          verbosity: info

      - name: Verify unique package output
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.artifact }}
        run: |
          mapfile -d '' packages < <(find artifacts/package -type f -name '*.zip' -print0)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "Expected exactly one plugin ZIP, found ${#packages[@]}." >&2
            exit 1
          fi
          if [[ "$(realpath -- "${packages[0]}")" != "$(realpath -- "$PACKAGE_PATH")" ]]; then
            echo "The sole plugin ZIP does not match the JPRM artifact output." >&2
            exit 1
          fi

      - name: Validate package
        run: >-
          dotnet run
          --project tools/TrickplayCropper.PackageValidator/TrickplayCropper.PackageValidator.csproj
          --configuration Release
          --no-build
          --no-restore
          --
          "${{ steps.package.outputs.artifact }}"
          src/Jellyfin.Plugin.TrickplayCropper/build.yaml

      - name: Publish the stable release from the merged build manifest
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.artifact }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          version="$(jq -r '.version' "${BUILD_MANIFEST}")"
          jq -r '.changelog' "${BUILD_MANIFEST}" > "${RUNNER_TEMP}/release-notes.md"

          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "Release v${version} already exists; reusing it instead of creating a duplicate."
            gh release upload "v${version}" "${PACKAGE_PATH}" --clobber
          else
            gh release create "v${version}" "${PACKAGE_PATH}" \
              --title "Trickplay Cropper ${version}" \
              --notes-file "${RUNNER_TEMP}/release-notes.md" \
              --target "${MERGE_COMMIT_SHA}"
          fi

  manifest:
    name: Submit the repository manifest update
    needs: publish
    runs-on: ubuntu-24.04
    if: >-
      github.event.pull_request.merged == true
      && github.event.pull_request.title == 'auto-release new version'
      && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    env:
      MANIFEST_FILE: manifest.json
      MANIFEST_BRANCH: auto-manifest
      MANIFEST_TITLE: auto-manifest update
    steps:
      - name: Verify manifest prerequisites
        env:
          RELEASE_BOT_PAT: ${{ secrets.RELEASE_BOT_PAT }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"

          if [[ -z "${RELEASE_BOT_PAT:-}" ]]; then
            echo "::error::RELEASE_BOT_PAT secret is unavailable; the manifest pipeline cannot complete." >&2
            exit 1
          fi

          bot_login="$(GH_TOKEN="${RELEASE_BOT_PAT}" gh api user --jq .login 2>/dev/null || echo 'the release bot')"

          if ! bot_push="$(GH_TOKEN="${RELEASE_BOT_PAT}" gh api "repos/${repo}" --jq .permissions.push 2>/dev/null)" \
            || [[ "${bot_push}" != "true" ]]; then
            echo "::error::RELEASE_BOT_PAT (${bot_login}) does not authenticate with push access to ${repo}; it cannot author the manifest pull request." >&2
            exit 1
          fi

          if ! can_approve="$(GH_TOKEN="${RELEASE_BOT_PAT}" gh api "repos/${repo}/actions/permissions/workflow" --jq .can_approve_pull_request_reviews 2>/dev/null)" \
            || [[ "${can_approve}" != "true" ]]; then
            echo "::error::Cannot confirm GitHub Actions may create and approve pull requests. RELEASE_BOT_PAT needs Administration read access, and that repository workflow permission must be enabled." >&2
            exit 1
          fi

          if ! rules="$(GH_TOKEN="${RELEASE_BOT_PAT}" gh api "repos/${repo}/rules/branches/main" 2>/dev/null)"; then
            echo "::error::Cannot read the branch rules that protect main. RELEASE_BOT_PAT needs Administration read access." >&2
            exit 1
          fi

          if ! jq -e 'any(.[]; .type == "pull_request")' <<<"${rules}" >/dev/null \
            || ! jq -e 'any(.[]; .type == "required_status_checks")' <<<"${rules}" >/dev/null; then
            echo "::error::main protection is incompatible: required pull request review and required status checks must both be enforced." >&2
            exit 1
          fi

          echo "Manifest prerequisites satisfied for bot ${bot_login}."

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "9.0.317"

      - name: Restore locked dependencies
        run: dotnet restore TrickplayCropper.sln --locked-mode

      - name: Build the manifest builder
        run: >-
          dotnet build tools/TrickplayCropper.ManifestBuilder/TrickplayCropper.ManifestBuilder.csproj
          --configuration Release
          --no-restore

      - name: Download the published release asset
        run: |
          set -euo pipefail
          version="$(jq -r '.version' "${BUILD_MANIFEST}")"
          gh release download "v${version}" --pattern "*.zip" --dir "${RUNNER_TEMP}/release-asset"

      - name: Build the repository manifest entry
        run: |
          set -euo pipefail
          version="$(jq -r '.version' "${BUILD_MANIFEST}")"
          zip_path="$(find "${RUNNER_TEMP}/release-asset" -name '*.zip' -print -quit)"
          asset_name="$(basename "${zip_path}")"
          source_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}/${asset_name}"

          if git show "origin/main:${MANIFEST_FILE}" > "${RUNNER_TEMP}/${MANIFEST_FILE}" 2>/dev/null; then
            echo "Seeded existing manifest from origin/main."
          fi

          dotnet run \
            --project tools/TrickplayCropper.ManifestBuilder/TrickplayCropper.ManifestBuilder.csproj \
            --configuration Release \
            --no-build \
            --no-restore \
            -- \
            "${BUILD_MANIFEST}" "${zip_path}" "${RUNNER_TEMP}/${MANIFEST_FILE}" "${source_url}"

      - name: Submit the manifest pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_PAT }}
        run: |
          set -euo pipefail
          version="$(jq -r '.version' "${BUILD_MANIFEST}")"

          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B "${MANIFEST_BRANCH}" origin/main
          cp "${RUNNER_TEMP}/${MANIFEST_FILE}" "${MANIFEST_FILE}"

          git add "${MANIFEST_FILE}"
          if git diff --cached --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "The repository manifest already contains this release; nothing to update."
            exit 0
          fi

          git commit -m "Publish repository manifest for v${version}"
          git push --force origin "${MANIFEST_BRANCH}"
          echo "changed=true" >> "${GITHUB_OUTPUT}"

          existing_pr="$(gh pr list --base main --head "${MANIFEST_BRANCH}" --state open \
            --json number --jq '.[0].number // empty')"

          if [[ -n "${existing_pr}" ]]; then
            gh pr edit "${existing_pr}" --title "${MANIFEST_TITLE}"
            echo "pr_number=${existing_pr}" >> "${GITHUB_OUTPUT}"
            echo "Updated manifest pull request #${existing_pr}."
          else
            pr_url="$(gh pr create --base main --head "${MANIFEST_BRANCH}" \
              --title "${MANIFEST_TITLE}" \
              --body "Automated repository manifest update for v${version}.")"
            pr_number="${pr_url##*/}"
            echo "pr_number=${pr_number}" >> "${GITHUB_OUTPUT}"
            echo "Opened manifest pull request #${pr_number}."
          fi

      - name: Wait for required checks on the manifest pull request
        if: steps.pr.outputs.changed == 'true'
        run: |
          set -euo pipefail
          gh pr checks "${{ steps.pr.outputs.pr_number }}" --watch --interval 30

      - name: Approve and merge the manifest pull request
        if: steps.pr.outputs.changed == 'true'
        run: |
          set -euo pipefail
          pr_number="${{ steps.pr.outputs.pr_number }}"
          gh pr review "${pr_number}" --approve --body "Automated manifest entry for the published release."
          gh pr merge "${pr_number}" --squash --delete-branch
