name: auto-release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  administration: read

concurrency:
  group: auto-release
  cancel-in-progress: false

env:
  RELEASE_BRANCH: auto-release
  RELEASE_TITLE: auto-release new version
  BUILD_MANIFEST: src/Jellyfin.Plugin.TrickplayCropper/build.yaml
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  prepare-release:
    name: Open or update the release pull request
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release prerequisites
        env:
          RELEASE_BOT_PAT: ${{ secrets.RELEASE_BOT_PAT }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"

          if [[ -z "${RELEASE_BOT_PAT:-}" ]]; then
            echo "::error::RELEASE_BOT_PAT secret is unavailable; the release pipeline cannot complete." >&2
            exit 1
          fi

          bot_login="$(GH_TOKEN="${RELEASE_BOT_PAT}" gh api user --jq .login 2>/dev/null || echo 'the release bot')"

          if ! bot_push="$(GH_TOKEN="${RELEASE_BOT_PAT}" gh api "repos/${repo}" --jq .permissions.push 2>/dev/null)" \
            || [[ "${bot_push}" != "true" ]]; then
            echo "::error::RELEASE_BOT_PAT (${bot_login}) does not authenticate with push access to ${repo}; it cannot author or review release pull requests." >&2
            exit 1
          fi

          if ! can_approve="$(gh api "repos/${repo}/actions/permissions/workflow" --jq .can_approve_pull_request_reviews 2>/dev/null)" \
            || [[ "${can_approve}" != "true" ]]; then
            echo "::error::Repository workflow permissions must allow GitHub Actions to create and approve pull requests." >&2
            exit 1
          fi

          if ! rules="$(gh api "repos/${repo}/rules/branches/main" 2>/dev/null)"; then
            echo "::error::Cannot read the branch rules that protect main." >&2
            exit 1
          fi

          if ! jq -e 'any(.[]; .type == "required_pull_request_review")' <<<"${rules}" >/dev/null \
            || ! jq -e 'any(.[]; .type == "required_status_checks")' <<<"${rules}" >/dev/null; then
            echo "::error::main protection is incompatible: required pull request review and required status checks must both be enforced." >&2
            exit 1
          fi

          echo "Release prerequisites satisfied for bot ${bot_login}."

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "9.0.317"

      - name: Compute changelog and next version
        id: plan
        run: |
          set -euo pipefail
          previous_tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1 || true)"
          if [[ -n "${previous_tag}" ]]; then
            changelog_range="${previous_tag}..HEAD"
            base_label="${previous_tag}"
          else
            changelog_range="HEAD"
            base_label="the repository root"
          fi

          git log --no-merges --pretty=format:'- %s' "${changelog_range}" > "${RUNNER_TEMP}/changelog.md"
          echo >> "${RUNNER_TEMP}/changelog.md"

          existing_pr="$(gh pr list --base main --head "${RELEASE_BRANCH}" --state open \
            --json number --jq '.[0].number // empty')"

          # Preserve a version a maintainer already proposed in the open pull request so a
          # routine main push refreshes the changelog without clobbering a major/minor edit.
          version_args=()
          if [[ -n "${existing_pr}" ]] && git fetch --quiet origin "${RELEASE_BRANCH}" 2>/dev/null; then
            proposed_version="$(git show "FETCH_HEAD:${BUILD_MANIFEST}" 2>/dev/null | jq -r '.version // empty' || true)"
            if [[ -n "${proposed_version}" ]]; then
              version_args=(--version "${proposed_version}")
            fi
          fi

          dotnet build tools/TrickplayCropper.ReleasePlanner/TrickplayCropper.ReleasePlanner.csproj \
            --configuration Release \
            --output "${RUNNER_TEMP}/release-planner" >/dev/null

          next_version="$(dotnet "${RUNNER_TEMP}/release-planner/TrickplayCropper.ReleasePlanner.dll" \
            "${BUILD_MANIFEST}" "${RUNNER_TEMP}/changelog.md" ${version_args[@]+"${version_args[@]}"})"

          echo "next_version=${next_version}" >> "${GITHUB_OUTPUT}"
          echo "base_label=${base_label}" >> "${GITHUB_OUTPUT}"
          echo "existing_pr=${existing_pr}" >> "${GITHUB_OUTPUT}"
          echo "Proposing release ${next_version} from ${base_label}."

      - name: Update the release branch
        id: branch
        env:
          NEXT_VERSION: ${{ steps.plan.outputs.next_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${RELEASE_BRANCH}"
          git add "${BUILD_MANIFEST}"

          if git diff --cached --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "The build manifest already matches the proposed release; nothing to update."
            exit 0
          fi

          git commit -m "Propose release ${NEXT_VERSION}"
          git push --force origin "${RELEASE_BRANCH}"
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Open or update the release pull request
        env:
          NEXT_VERSION: ${{ steps.plan.outputs.next_version }}
          BASE_LABEL: ${{ steps.plan.outputs.base_label }}
          EXISTING_PR: ${{ steps.plan.outputs.existing_pr }}
          CHANGED: ${{ steps.branch.outputs.changed }}
        run: |
          set -euo pipefail
          if [[ "${CHANGED}" != "true" ]]; then
            echo "No pull request update is required for this push."
            exit 0
          fi

          {
            echo "## Proposed release ${NEXT_VERSION}"
            echo
            echo "Changelog base: ${BASE_LABEL}."
            echo
            echo "### Changelog"
            echo
            cat "${RUNNER_TEMP}/changelog.md"
            echo
            echo "---"
            echo
            echo "This pull request is opened and updated automatically on every push to \`main\`."
            echo "It never publishes a release on its own. The proposed version increments the third"
            echo "component of the build manifest; a maintainer may edit the major or minor components"
            echo "here, and that edit is preserved while this pull request stays open. Merging publishes"
            echo "the stable GitHub Release and manifest update."
          } > "${RUNNER_TEMP}/pull-request-body.md"

          if [[ -n "${EXISTING_PR}" ]]; then
            gh pr edit "${EXISTING_PR}" --body-file "${RUNNER_TEMP}/pull-request-body.md"
            echo "Updated release pull request #${EXISTING_PR}."
          else
            gh pr create --base main --head "${RELEASE_BRANCH}" \
              --title "${RELEASE_TITLE}" --body-file "${RUNNER_TEMP}/pull-request-body.md"
            echo "Opened a new release pull request titled '${RELEASE_TITLE}'."
          fi
